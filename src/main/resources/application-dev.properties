spring.application.name=projectx

spring.datasource.url=jdbc:h2:file:./data/projectxdb;MODE=PostgreSQL;
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.error.include-message=always
server.error.include-binding-errors=always

app.security.jwt.secret=${APP_JWT_SECRET:replace-this-with-a-very-long-random-secret-key-at-least-32-bytes}
app.security.jwt.expiration-minutes=${APP_JWT_EXPIRATION_MINUTES:60}
app.security.cors.allowed-origin-patterns=${APP_SECURITY_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost,http://localhost:*,https://localhost,https://localhost:*}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

app.logging.info-file=${APP_INFO_LOG_FILE:logs/projectx-dev-info.log}
app.logging.error-file=${APP_ERROR_LOG_FILE:logs/projectx-dev-error.log}
