spring.application.name=projectx

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

server.error.include-message=always
server.error.include-binding-errors=always

app.security.jwt.secret=${APP_JWT_SECRET:replace-this-with-a-very-long-random-secret-key-at-least-32-bytes}
app.security.jwt.expiration-minutes=${APP_JWT_EXPIRATION_MINUTES:60}
app.security.cors.allowed-origin-patterns=${APP_SECURITY_CORS_ALLOWED_ORIGIN_PATTERNS:https://rafael-alves.com}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

app.logging.info-file=${APP_INFO_LOG_FILE:logs/projectx-info.log}
app.logging.error-file=${APP_ERROR_LOG_FILE:logs/projectx-error.log}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

server.address=127.0.0.1
server.port=8080
server.forward-headers-strategy=framework
