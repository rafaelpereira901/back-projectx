name: Build And Deploy To VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Jar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build
        run: mvn -B clean package

      - name: Select executable jar
        run: |
          set -euo pipefail
          JAR_PATH=$(find target -maxdepth 1 -type f -name "*.jar" ! -name "*.jar.original" | head -n 1)
          if [ -z "$JAR_PATH" ]; then
            echo "No executable JAR found in target/."
            exit 1
          fi
          cp "$JAR_PATH" app.jar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: projectx-jar
          path: app.jar
          if-no-files-found: error

  deploy:
    name: Deploy To VPS
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: projectx-jar
          path: .

      - name: Configure SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Configure known hosts
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Copy jar to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          scp -P "$PORT" app.jar "$VPS_USER@$VPS_HOST:/tmp/projectx-app.jar"

      - name: Activate release and restart service
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"

          ssh -p "$PORT" "$VPS_USER@$VPS_HOST" 'bash -s' <<'EOF'
          set -euo pipefail

          APP_DIR=/opt/projectx
          RELEASES_DIR="$APP_DIR/releases"
          CURRENT_LINK="$APP_DIR/current"
          SERVICE_NAME=projectx

          mkdir -p "$RELEASES_DIR"

          TS=$(date +%Y%m%d%H%M%S)
          RELEASE_DIR="$RELEASES_DIR/$TS"
          mkdir -p "$RELEASE_DIR"

          mv /tmp/projectx-app.jar "$RELEASE_DIR/app.jar"
          ln -sfn "$RELEASE_DIR" "$CURRENT_LINK"

          sudo systemctl daemon-reload
          sudo systemctl restart "$SERVICE_NAME"
          sudo systemctl --no-pager --full status "$SERVICE_NAME" | head -n 25
          EOF
